name: Feature request
description: Something you'd like the widget to do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation, not just the feature, it helps find the right design.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How would you like it to work?
      description: Rough is fine. Where in the panel, what it shows, what it does.
  - type: checkboxes
    id: policy
    attributes:
      label: Policy
      options:
        - label: I understand this repository has a single author and closes pull requests for security reasons, this is a request, not an offer to implement it.
          required: true
